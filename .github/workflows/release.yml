name: Release

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "27.1"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "15.0"
        required: true
        type: string
      decrypted_ipa_url:
        description: "Direct URL of the decrypted X ipa (required for sideloaded/trollstore)"
        default: ""
        required: true
        type: string
      resource_pack_url:
        description: "Custom app icon pack (.ZIP) used for the branded IPA builds"
        default: "https://files.catbox.moe/p63f20.zip"
        required: false
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      create_release:
        description: "Collect every build into a single draft release"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    name: Build ffmpeg Stack
    runs-on: xcode-27
    outputs:
      cache-key: ${{ steps.ffmpeg-key.outputs.key }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Compute ffmpeg Cache Key
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-stack-sdk$(xcrun --sdk iphoneos --show-sdk-version)-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.sh') }}" >> "$GITHUB_OUTPUT"

      - name: ffmpeg Stack Caching
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Build ffmpeg Stack
        if: steps.cache.outputs.cache-hit != 'true'
        run: main/deps/ffmpeg-kit-next/build-ffmpeg.sh
        env:
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build

  build:
    name: Build ${{ matrix.deploy_format }}
    runs-on: xcode-27
    needs: ffmpeg
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - deploy_format: rootfull
            ipa: false
          - deploy_format: rootless
            ipa: false
          - deploy_format: sideloaded
            ipa: true
          - deploy_format: trollstore
            ipa: true

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install cyan
        if: matrix.ipa
        run: pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Set Up iOS SDK
        run: |
          # theos/sdks stops at 16.5, so newer SDKs come from an installed Xcode
          for XCODE in /Applications/Xcode*.app; do
            SDK_PATH="$XCODE/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :Version" "$SDK_PATH/SDKSettings.plist" 2>/dev/null || true)
            echo "$XCODE: iOS SDK ${VERSION:-none}"
            if [ "$VERSION" = "$SDK_VERSION" ]; then
              sudo xcode-select -s "$XCODE"
              ln -s "$SDK_PATH" "${THEOS}/sdks/iPhoneOS${SDK_VERSION}.sdk"
              exit 0
            fi
          done

          echo "No installed Xcode has iOS SDK $SDK_VERSION, trying theos/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${SDK_VERSION}.sdk
          git checkout
          if ! ls -d ./*.sdk >/dev/null 2>&1; then
            echo "::error::iOS SDK $SDK_VERSION not found in any installed Xcode or theos/sdks"
            exit 1
          fi
          mv ./*.sdk "${THEOS}/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos
          SDK_VERSION: ${{ inputs.sdk_version }}

      - name: Get Tweak Info
        id: tweak_info
        run: |
          TWEAK_NAME=$(sed -n 's/^Name: *//p' main/control)
          TWEAK_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "name=${TWEAK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${TWEAK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$TWEAK_NAME $TWEAK_VERSION"

      - name: Prepare X iPA
        if: matrix.ipa
        id: x_version
        run: |
          wget "$IPA_URL" --no-verbose -O main/packages/com.atebits.Tweetie2.ipa
          unzip -q main/packages/com.atebits.Tweetie2.ipa -d main/tmp
          X_VERSION=$(grep -A 1 '<key>CFBundleShortVersionString</key>' main/tmp/Payload/Twitter.app/Info.plist |
            grep '<string>' | awk -F'[><]' '{print $3}')
          echo "version=${X_VERSION}" >> "$GITHUB_OUTPUT"
          echo "$X_VERSION"
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Prepare Image Pack
        if: matrix.ipa && inputs.resource_pack_url != ''
        run: |
          wget "$IMAGE_URL" --no-verbose -O main/resource-pack.zip
        env:
          IMAGE_URL: ${{ inputs.resource_pack_url }}

      - name: ffmpeg Stack Caching
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ needs.ffmpeg.outputs.cache-key }}

      - name: Build Package
        run: |
          cd ${{ github.workspace }}/main
          sed -i '' "s/^TARGET.*$/TARGET := iphone:clang:${{ inputs.sdk_version }}:${{ inputs.target_version }}/" \
            Makefile deps/flex/Makefile deps/zxPluginsInject/upstream/Makefile
          ./build.sh --${{ matrix.deploy_format }}
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build

      - name: Rename IPA to include IPA version
        if: matrix.ipa
        run: |
          mv "main/packages/$(ls -t main/packages | head -n1)" \
             "main/packages/${{ steps.tweak_info.outputs.name }}-${{ matrix.deploy_format }}-X_${{ steps.tweak_info.outputs.version }}_${{ steps.x_version.outputs.version }}.${IPA_EXT}"
        env:
          IPA_EXT: ${{ matrix.deploy_format == 'trollstore' && 'tipa' || 'ipa' }}

      - name: Rebrand IPA to Twitter variant
        if: matrix.ipa
        run: |
          cd ${{ github.workspace }}/main
          IMAGE_FLAG=""
          if [ -f resource-pack.zip ]; then IMAGE_FLAG="--resource-pack resource-pack.zip"; fi
          ./rebrand.sh --twitter-branding $IMAGE_FLAG \
            -o "packages/${{ steps.tweak_info.outputs.name }}-${{ matrix.deploy_format }}-Twitter_${{ steps.tweak_info.outputs.version }}_${{ steps.x_version.outputs.version }}.${IPA_EXT}" \
            "packages/${{ steps.tweak_info.outputs.name }}-${{ matrix.deploy_format }}-X_${{ steps.tweak_info.outputs.version }}_${{ steps.x_version.outputs.version }}.${IPA_EXT}"
        env:
          IPA_EXT: ${{ matrix.deploy_format == 'trollstore' && 'tipa' || 'ipa' }}

      - name: Add to Draft Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.tweak_info.outputs.version }}
          name: v${{ steps.tweak_info.outputs.version }} - ${{ steps.tweak_info.outputs.name }}
          files: |
            main/packages/${{ steps.tweak_info.outputs.name }}-*
            main/packages/*.deb
          draft: true
